name: build-packages

# 本仓库只负责「这两个包」：每次改代码 → 用官方 ImmortalWrt SDK 编出 .apk → 发一个版本 Release。
# 不会触发固件仓库 —— 固件什么时候编，由固件仓库自己的代码改动 / 上游更新决定。

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_URL: https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic/immortalwrt-sdk-mediatek-filogic_gcc-14.4.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: 编包 → 发版本 Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载并解开 SDK
        run: |
          set -euo pipefail
          FILE="${SDK_URL##*/}"
          URLS=(
            "$SDK_URL"
            "https://mirror.nju.edu.cn/immortalwrt/snapshots/targets/mediatek/filogic/$FILE"
          )
          ok=0
          for url in "${URLS[@]}"; do
            echo "::group::下载 $url"
            if timeout 420 curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 \
                 --speed-time 60 --speed-limit 1024 -o /tmp/sdk.tar.zst "$url" \
               && tar --zstd -tf /tmp/sdk.tar.zst >/dev/null 2>&1; then
              echo "✅ $(basename "$url")"
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "⚠️ 这个源不可用，换下一个"
            echo "::endgroup::"
          done
          [ "$ok" = 1 ] || { echo "::error::SDK 下载失败（官方和镜像都不可用）"; exit 1; }
          mkdir -p sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C sdk --strip-components=1
          ls sdk | head

      - name: 编译两个包
        run: |
          set -euo pipefail
          cp -a luci-app-openfi-fan openfi-lib sdk/package/
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf 'CONFIG_PACKAGE_luci-app-openfi-fan=y\nCONFIG_PACKAGE_openfi-lib=y\n' >> .config
          make defconfig
          make -j"$(nproc)" package/openfi-lib/compile V=s
          make -j"$(nproc)" package/luci-app-openfi-fan/compile V=s
          # 只要这两个包（绝对路径，后面在仓库根目录收集）
          find "$PWD/bin/packages" -type f \( -name 'openfi-lib-*.apk' -o -name 'luci-app-openfi-fan-*.apk' \) | tee /tmp/pkgs.txt
          [ -s /tmp/pkgs.txt ] || { echo '::error::没编出 .apk'; exit 1; }

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p out
          xargs -r cp -t out < /tmp/pkgs.txt
          ( cd out && sha256sum * > SHA256SUMS )
          ls -lh out

      - name: 发版本
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(sed -n 's/^PKG_VERSION:=//p' luci-app-openfi-fan/Makefile | head -1)
          R=$(sed -n 's/^PKG_RELEASE:=//p' luci-app-openfi-fan/Makefile | head -1)
          TAG="v${V:-0}-r${R:-0}-$(date -u +%Y%m%d%H%M)-$(git rev-parse --short HEAD)"
          {
            echo "## openfi-packages ${TAG}"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`${GITHUB_SHA:0:10}\` |"
            echo "| SDK | \`${SDK_URL##*/}\` |"
            echo "| 产物 | $(ls out | tr '\n' ' ') |"
            echo
            echo "改这些文件请到 [openfi-packages](https://github.com/${GITHUB_REPOSITORY})；固件仓库以 feed 形式拉取本仓库源码编译。"
          } > /tmp/notes.md
          gh release create "$TAG" out/* \
            --title "openfi-packages $TAG" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

