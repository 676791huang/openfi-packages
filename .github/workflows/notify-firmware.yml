name: notify-firmware

# 这里一改，就让固件仓库重新构建一次。
# 注意：跨仓库触发需要 PAT（secrets.FIRMWARE_DISPATCH_TOKEN），GITHUB_TOKEN 不行。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 触发固件仓库 build
        env:
          TOKEN: ${{ secrets.FIRMWARE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN:-}" ] || { echo "::error::缺少 FIRMWARE_DISPATCH_TOKEN"; exit 1; }
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/676791huang/immortalwrt-mt798x-rebase/dispatches" \
            -d "{\"event_type\":\"openfi-packages\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}"
          echo "✅ 已通知固件仓库（event_type=openfi-packages, sha=${GITHUB_SHA:0:10}）"
